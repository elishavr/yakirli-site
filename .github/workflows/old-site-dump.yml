name: old-site-dump
on:
  push:
    branches: [old-site-dump]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YouTube titles
        run: |
          for id in $(grep -ohE 'youtu\.be/[A-Za-z0-9_-]{11}|v=[A-Za-z0-9_-]{11}' dump/pages/lectures-mudaot.html | sed -E 's#.*(/|=)##' | sort -u); do
            t=$(curl -s "https://www.youtube.com/oembed?format=json&url=https://youtu.be/$id" | python3 -c "import sys,json;print(json.load(sys.stdin)['title'])" 2>/dev/null || echo "?")
            printf '%s\t%s\n' "$id" "$t" >> dump/yt.tsv
          done
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add dump && git commit -m "yt titles" && git push
