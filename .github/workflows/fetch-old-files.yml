# חד־פעמי (1.11.2026): העתקת קובצי חומרי שבוע המודעות מהאתר הישן ל-assets/files. יימחק אחרי הריצה.
name: Fetch old-site files (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-old-files.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and relink
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, re
          U="https://yakirli.org/wp-content/uploads/"
          files={
           "week-chavruta.pdf":U+"2026/03/%D7%97%D7%91%D7%A8%D7%95%D7%AA%D7%90-%D7%93%D7%A4%D7%99-%D7%9C%D7%99%D7%9E%D7%95%D7%93-%D7%A2%D7%99%D7%95%D7%9F-0326.pdf",
           "week-lesson-content.pdf":U+"2026/03/%D7%AA%D7%95%D7%9B%D7%9F-%D7%93%D7%A4%D7%99-%D7%9C%D7%99%D7%9E%D7%95%D7%93-%D7%95%D7%A9%D7%99%D7%A2%D7%95%D7%A8%D7%99%D7%9D.pdf",
           "week-qa.pdf":U+"2026/03/%D7%A9%D7%90%D7%9C%D7%95%D7%AA-%D7%95%D7%AA%D7%A9%D7%95%D7%91%D7%95%D7%AA.pdf",
           "week-songbook-admat-libi.pdf":U+"2025/03/%D7%97%D7%95%D7%91%D7%A8%D7%AA-%D7%A9%D7%99%D7%A8%D7%99%D7%9D-%D7%90%D7%93%D7%9E%D7%AA-%D7%9C%D7%99%D7%91%D7%99.-%D7%A9%D7%99%D7%A8%D7%99-%D7%A9%D7%9B%D7%95%D7%9C-%D7%95%D7%92%D7%A2%D7%92%D7%95%D7%A2_compressed.pdf",
           "week-companion-booklet.pdf":U+"2026/01/%D7%97%D7%95%D7%91%D7%A8%D7%AA-%D7%9E%D7%9C%D7%95%D7%95%D7%94-%D7%A9%D7%91%D7%95%D7%A2-%D7%AA%D7%A9%D7%A4%D7%95-%D7%9E%D7%95%D7%93%D7%A2%D7%95%D7%AA-1_compressed.pdf",
           "week-community-ideas.pdf":U+"2026/01/%D7%94%D7%A6%D7%A2%D7%95%D7%AA-%D7%95%D7%97%D7%95%D7%9E%D7%A8%D7%99-%D7%A2%D7%96%D7%A8-%D7%9C%D7%A4%D7%A2%D7%99%D7%9C%D7%95%D7%99%D7%95%D7%AA-%D7%AA%D7%A9%D7%A4%D7%95-%D7%91%D7%A7%D7%94%D7%99%D7%9C%D7%94-1-compressed.pdf",
           "week-events-5786.pdf":U+"2026/01/%D7%90%D7%A8%D7%95%D7%A2%D7%99-%D7%A9%D7%91%D7%95%D7%A2-%D7%9E%D7%95%D7%93%D7%A2%D7%95%D7%AA-%D7%AA%D7%A9%D7%A4%D7%95_compressed.pdf",
           "week-how-to-take-part.pdf":U+"2026/01/%D7%90%D7%99%D7%9A-%D7%90%D7%A0%D7%99-%D7%99%D7%9B%D7%95%D7%9C-%D7%9C%D7%A7%D7%97%D7%AA-%D7%97%D7%9C%D7%A7-%D7%AA%D7%A9%D7%A4%D7%95_compressed.pdf"}
          page=pathlib.Path("src/he/week.html"); s=page.read_text()
          for name,url in files.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  data=urllib.request.urlopen(req,timeout=60).read()
              except Exception as e:
                  print("FAIL",name,e); continue
              if not data.startswith(b"%PDF"): print("NOT PDF",name); continue
              pathlib.Path("assets/files/"+name).write_bytes(data)
              s=s.replace(url,"/assets/files/"+name); print("OK",name,len(data))
          page.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/files src/he/week.html
          git commit -m "העתקת 8 קובצי חומרי שבוע המודעות מהאתר הישן ל-assets/files" || echo "nothing to commit"
          git push
